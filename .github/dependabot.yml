version: 2
updates:
- package-ecosystem: devcontainers
  directory: /
  schedule:
    interval: weekly

- package-ecosystem: docker-compose
  directory: /.devcontainer
  schedule:
    interval: weekly

- package-ecosystem: composer
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  versioning-strategy: increase

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
