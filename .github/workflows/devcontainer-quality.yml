name: Devcontainer quality

on:
  pull_request:
    paths:
    - .devcontainer/**
    - .github/workflows/devcontainer-quality.yml

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build image and run checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Build devcontainer and run quality checks
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      with:
        push: never
        runCmd: |
          composer install --no-progress
          make audit
          make cs
          make stan
          make test
