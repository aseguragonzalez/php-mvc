name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Validate PR title follows Conventional Commits
      uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
